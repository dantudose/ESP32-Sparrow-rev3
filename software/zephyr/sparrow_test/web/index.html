<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BME680 Dashboard</title>
    <style>
      :root {
        --bg-1: #f6f0e6;
        --bg-2: #f0f7f5;
        --panel: #ffffff;
        --ink: #1f2a2a;
        --muted: #5a6a68;
        --accent: #f26b3a;
        --accent-2: #2a9d8f;
        --accent-3: #2d6cdf;
        --grid: #e6e0d4;
        --shadow: rgba(23, 26, 26, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", "IBM Plex Sans", "Avenir Next", "Fira Sans", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(900px 500px at 10% -10%, #ffe1b8, transparent 70%),
          radial-gradient(700px 420px at 100% 0%, #d5f0ff, transparent 65%),
          linear-gradient(180deg, var(--bg-1), var(--bg-2));
        min-height: 100vh;
        overflow-x: hidden;
      }

      .bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .orb {
        position: absolute;
        border-radius: 999px;
        filter: blur(35px);
        opacity: 0.55;
        animation: float 18s ease-in-out infinite;
      }

      .orb.a {
        width: 260px;
        height: 260px;
        background: #ffd39b;
        top: 6%;
        left: -40px;
      }

      .orb.b {
        width: 220px;
        height: 220px;
        background: #c3f0e9;
        top: 30%;
        right: -40px;
        animation-delay: -6s;
      }

      .orb.c {
        width: 280px;
        height: 280px;
        background: #c9d7ff;
        bottom: -40px;
        left: 20%;
        animation-delay: -12s;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(18px); }
      }

      .container {
        position: relative;
        z-index: 1;
        max-width: 1100px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 3rem;
      }

      .hero {
        display: grid;
        gap: 0.75rem;
        margin-bottom: 2rem;
        animation: fadeUp 0.6s ease both;
      }

      .title {
        font-size: clamp(2rem, 3vw, 2.8rem);
        letter-spacing: -0.02em;
      }

      .subtitle {
        color: var(--muted);
        font-size: 1rem;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }

      .pill {
        background: #fff1dc;
        color: #8b4a1d;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        font-size: 0.85rem;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #b4b4b4;
      }

      .status.ok::before { background: #2a9d8f; }
      .status.warn::before { background: #f4a261; }
      .status.err::before { background: #e63946; }

      button {
        border: 0;
        background: var(--ink);
        color: #fff;
        padding: 0.5rem 0.9rem;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        font-size: 0.9rem;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px var(--shadow);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .card {
        background: var(--panel);
        border-radius: 14px;
        padding: 1rem 1.1rem;
        box-shadow: 0 8px 18px var(--shadow);
        display: grid;
        gap: 0.4rem;
        animation: fadeUp 0.6s ease both;
      }

      .card .label {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .card .value {
        font-size: 1.5rem;
        font-weight: 600;
      }

      .card .unit {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .card .trend {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .charts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.2rem;
      }

      .panel {
        background: var(--panel);
        border-radius: 16px;
        padding: 1rem 1.2rem 1.1rem;
        box-shadow: 0 12px 24px var(--shadow);
        display: grid;
        gap: 0.8rem;
        animation: fadeUp 0.6s ease both;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .panel h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .chip {
        background: #f2f5f7;
        color: var(--muted);
        border-radius: 999px;
        font-size: 0.8rem;
        padding: 0.2rem 0.5rem;
      }

      canvas {
        width: 100%;
        height: 220px;
        border-radius: 10px;
        background: #fbfbfa;
      }

      .foot {
        margin-top: 2rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      .foot-card {
        background: var(--panel);
        border-radius: 12px;
        padding: 0.9rem 1rem;
        box-shadow: 0 6px 14px var(--shadow);
        color: var(--muted);
        font-size: 0.9rem;
        animation: fadeUp 0.6s ease both;
      }

      .mono {
        font-family: "Fira Mono", "SF Mono", "Cascadia Mono", monospace;
        color: var(--ink);
        font-size: 0.9rem;
        margin-top: 0.3rem;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 900px) {
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .charts {
          grid-template-columns: 1fr;
        }
        .foot {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 600px) {
        .meta-row {
          flex-direction: column;
          align-items: flex-start;
        }
        canvas {
          height: 200px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .orb, .panel, .card, .hero, .foot-card {
          animation: none;
        }
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="orb a"></div>
      <div class="orb b"></div>
      <div class="orb c"></div>
    </div>
    <main class="container">
      <header class="hero">
        <div class="title">BME680 Dashboard</div>
        <div class="subtitle">Live sensor log streamed from /bme_log</div>
        <div class="meta-row">
          <div id="status" class="status">Idle</div>
          <div class="pill">Auto-refresh: 10s</div>
          <button id="refresh">Refresh now</button>
          <div id="window" class="subtitle"></div>
        </div>
      </header>

      <section class="stats">
        <article class="card">
          <div class="label">Temperature</div>
          <div class="value" id="stat-temp">--</div>
          <div class="unit">C</div>
          <div class="trend" id="trend-temp">--</div>
        </article>
        <article class="card">
          <div class="label">Humidity</div>
          <div class="value" id="stat-hum">--</div>
          <div class="unit">%</div>
          <div class="trend" id="trend-hum">--</div>
        </article>
        <article class="card">
          <div class="label">Pressure</div>
          <div class="value" id="stat-press">--</div>
          <div class="unit">kPa</div>
          <div class="trend" id="trend-press">--</div>
        </article>
        <article class="card">
          <div class="label">Gas Resistance</div>
          <div class="value" id="stat-gas">--</div>
          <div class="unit">kOhm</div>
          <div class="trend" id="trend-gas">--</div>
        </article>
      </section>

      <section class="charts">
        <article class="panel">
          <div class="panel-head">
            <h2>Temperature</h2>
            <div class="chip">C</div>
          </div>
          <canvas id="chart-temp"></canvas>
        </article>
        <article class="panel">
          <div class="panel-head">
            <h2>Humidity</h2>
            <div class="chip">%</div>
          </div>
          <canvas id="chart-hum"></canvas>
        </article>
        <article class="panel">
          <div class="panel-head">
            <h2>Pressure</h2>
            <div class="chip">kPa</div>
          </div>
          <canvas id="chart-press"></canvas>
        </article>
        <article class="panel">
          <div class="panel-head">
            <h2>Gas Resistance</h2>
            <div class="chip">kOhm</div>
          </div>
          <canvas id="chart-gas"></canvas>
        </article>
      </section>

      <section class="foot">
        <div class="foot-card">
          <div>CSV endpoint</div>
          <div class="mono">/bme_log</div>
        </div>
        <div class="foot-card">
          <div>Log file</div>
          <div class="mono">/lfs/logs/bme_log.dat</div>
        </div>
      </section>
    </main>

    <script>
      const REFRESH_MS = 10000;
      const MAX_POINTS = 300;

      const elements = {
        status: document.getElementById("status"),
        window: document.getElementById("window"),
        refresh: document.getElementById("refresh"),
        statTemp: document.getElementById("stat-temp"),
        statHum: document.getElementById("stat-hum"),
        statPress: document.getElementById("stat-press"),
        statGas: document.getElementById("stat-gas"),
        trendTemp: document.getElementById("trend-temp"),
        trendHum: document.getElementById("trend-hum"),
        trendPress: document.getElementById("trend-press"),
        trendGas: document.getElementById("trend-gas"),
        chartTemp: document.getElementById("chart-temp"),
        chartHum: document.getElementById("chart-hum"),
        chartPress: document.getElementById("chart-press"),
        chartGas: document.getElementById("chart-gas")
      };

      function setStatus(text, kind) {
        elements.status.textContent = text;
        elements.status.classList.remove("ok", "warn", "err");
        if (kind) {
          elements.status.classList.add(kind);
        }
      }

      function formatFixed(value, digits) {
        if (!Number.isFinite(value)) {
          return "--";
        }
        return value.toFixed(digits);
      }

      function formatWindow(seconds) {
        if (!Number.isFinite(seconds)) {
          return "";
        }
        const s = Math.max(0, Math.round(seconds));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const r = s % 60;
        if (h > 0) {
          return h + "h " + m + "m";
        }
        if (m > 0) {
          return m + "m " + r + "s";
        }
        return r + "s";
      }

      function parseCsv(text) {
        const trimmed = text.trim();
        if (!trimmed) {
          return [];
        }
        const lines = trimmed.split(/\r?\n/);
        let start = 0;
        if (lines[0].toLowerCase().startsWith("timestamp")) {
          start = 1;
        }
        const tail = lines.slice(start).slice(-MAX_POINTS);
        const points = [];
        for (const line of tail) {
          if (!line) {
            continue;
          }
          const parts = line.split(",");
          if (parts.length < 5) {
            continue;
          }
          const ts = Number(parts[0]);
          const temp = Number(parts[1]);
          const press = Number(parts[2]);
          const hum = Number(parts[3]);
          const gas = Number(parts[4]);
          if (!Number.isFinite(ts)) {
            continue;
          }
          points.push({
            t: ts / 1000,
            temp,
            press,
            hum,
            gas
          });
        }
        return points;
      }

      function updateStats(points) {
        if (!points.length) {
          elements.statTemp.textContent = "--";
          elements.statHum.textContent = "--";
          elements.statPress.textContent = "--";
          elements.statGas.textContent = "--";
          elements.trendTemp.textContent = "--";
          elements.trendHum.textContent = "--";
          elements.trendPress.textContent = "--";
          elements.trendGas.textContent = "--";
          return;
        }

        const last = points[points.length - 1];
        const first = points[0];
        const gasK = last.gas / 1000;
        const gasKFirst = first.gas / 1000;

        elements.statTemp.textContent = formatFixed(last.temp, 2);
        elements.statHum.textContent = formatFixed(last.hum, 2);
        elements.statPress.textContent = formatFixed(last.press, 2);
        elements.statGas.textContent = formatFixed(gasK, 2);

        elements.trendTemp.textContent = "Delta: " + formatFixed(last.temp - first.temp, 2);
        elements.trendHum.textContent = "Delta: " + formatFixed(last.hum - first.hum, 2);
        elements.trendPress.textContent = "Delta: " + formatFixed(last.press - first.press, 2);
        elements.trendGas.textContent = "Delta: " + formatFixed(gasK - gasKFirst, 2);
      }

      function niceNumber(value) {
        const exp = Math.floor(Math.log10(value));
        const f = value / Math.pow(10, exp);
        let nf = 1;
        if (f < 1.5) {
          nf = 1;
        } else if (f < 3) {
          nf = 2;
        } else if (f < 7) {
          nf = 5;
        } else {
          nf = 10;
        }
        return nf * Math.pow(10, exp);
      }

      function drawChart(canvas, points, config) {
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        const width = Math.floor(canvas.clientWidth * dpr);
        const height = Math.floor(canvas.clientHeight * dpr);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }

        ctx.clearRect(0, 0, width, height);

        if (points.length < 2) {
          ctx.fillStyle = "#888";
          ctx.font = "12px " + getComputedStyle(document.body).fontFamily;
          ctx.fillText("No data yet", 12, 20);
          return;
        }

        const values = points.map(config.value);
        let min = Math.min.apply(null, values);
        let max = Math.max.apply(null, values);
        if (!Number.isFinite(min) || !Number.isFinite(max)) {
          return;
        }
        if (min === max) {
          min -= 1;
          max += 1;
        }
        const range = max - min;
        const pad = range * 0.12;
        const vmin = min - pad;
        const vmax = max + pad;

        const padding = {
          left: 52 * dpr,
          right: 16 * dpr,
          top: 16 * dpr,
          bottom: 28 * dpr
        };

        const chartW = width - padding.left - padding.right;
        const chartH = height - padding.top - padding.bottom;
        const t0 = points[0].t;
        const t1 = points[points.length - 1].t;
        const dt = Math.max(1, t1 - t0);

        const font = getComputedStyle(document.body).fontFamily;
        ctx.font = `${12 * dpr}px ${font}`;
        ctx.fillStyle = "#7c7c7c";
        ctx.strokeStyle = "#e8e1d6";
        ctx.lineWidth = 1 * dpr;

        const steps = 4;
        const stepVal = niceNumber((vmax - vmin) / steps);
        const gridMin = Math.floor(vmin / stepVal) * stepVal;
        const gridMax = Math.ceil(vmax / stepVal) * stepVal;
        const gridSteps = Math.round((gridMax - gridMin) / stepVal);

        for (let i = 0; i <= gridSteps; i++) {
          const value = gridMax - i * stepVal;
          const y = padding.top + (chartH * i) / gridSteps;
          ctx.beginPath();
          ctx.moveTo(padding.left, y);
          ctx.lineTo(width - padding.right, y);
          ctx.stroke();
          ctx.fillText(value.toFixed(2), 4 * dpr, y + 4 * dpr);
        }

        ctx.fillText("t+0", padding.left, height - 6 * dpr);
        const windowLabel = formatWindow(t1 - t0);
        ctx.fillText(windowLabel, width - padding.right - 48 * dpr, height - 6 * dpr);

        const xFor = (t) => padding.left + ((t - t0) / dt) * chartW;
        const yFor = (v) => padding.top + (1 - (v - vmin) / (vmax - vmin)) * chartH;

        const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
        gradient.addColorStop(0, config.fill);
        gradient.addColorStop(1, "rgba(255,255,255,0)");

        ctx.beginPath();
        points.forEach((p, i) => {
          const x = xFor(p.t);
          const y = yFor(config.value(p));
          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        });

        ctx.strokeStyle = config.color;
        ctx.lineWidth = 2 * dpr;
        ctx.stroke();

        ctx.lineTo(padding.left + chartW, padding.top + chartH);
        ctx.lineTo(padding.left, padding.top + chartH);
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();

        const last = points[points.length - 1];
        ctx.beginPath();
        ctx.arc(xFor(last.t), yFor(config.value(last)), 3.5 * dpr, 0, Math.PI * 2);
        ctx.fillStyle = config.color;
        ctx.fill();
      }

      const palette = {
        temp: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim(),
        hum: getComputedStyle(document.documentElement).getPropertyValue("--accent-2").trim(),
        press: getComputedStyle(document.documentElement).getPropertyValue("--accent-3").trim(),
        gas: "#5a4bff"
      };

      const configs = [
        {
          canvas: elements.chartTemp,
          value: (p) => p.temp,
          color: palette.temp,
          fill: "rgba(242,107,58,0.2)"
        },
        {
          canvas: elements.chartHum,
          value: (p) => p.hum,
          color: palette.hum,
          fill: "rgba(42,157,143,0.2)"
        },
        {
          canvas: elements.chartPress,
          value: (p) => p.press,
          color: palette.press,
          fill: "rgba(45,108,223,0.2)"
        },
        {
          canvas: elements.chartGas,
          value: (p) => p.gas / 1000,
          color: palette.gas,
          fill: "rgba(90,75,255,0.18)"
        }
      ];

      function render(points) {
        updateStats(points);
        if (points.length) {
          const windowSec = points[points.length - 1].t - points[0].t;
          elements.window.textContent = `Window: ${formatWindow(windowSec)}, Points: ${points.length}`;
        } else {
          elements.window.textContent = "";
        }
        configs.forEach((cfg) => drawChart(cfg.canvas, points, cfg));
      }

      async function refresh() {
        try {
          setStatus("Updating...", "warn");
          const response = await fetch("/bme_log", { cache: "no-store" });
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          const text = await response.text();
          const points = parseCsv(text);
          if (points.length) {
            setStatus("Live", "ok");
          } else {
            setStatus("No data", "warn");
          }
          render(points);
        } catch (err) {
          setStatus("Error: " + err.message, "err");
          render([]);
        }
      }

      elements.refresh.addEventListener("click", refresh);
      refresh();
      setInterval(refresh, REFRESH_MS);
      window.addEventListener("resize", () => refresh());
    </script>
  </body>
</html>
